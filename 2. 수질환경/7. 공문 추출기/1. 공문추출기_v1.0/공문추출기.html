<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검사의뢰 공문 추출기</title>
<style>
:root {
  --bg: #f4f6f9; --panel: #ffffff; --line: #dfe4ec; --line-strong: #c9d1dd;
  --text: #1d2633; --muted: #667085; --head: #1f2b3a; --head-text: #f2f5f9;
  --accent: #1f5fae; --accent-soft: #e6eefa; --ok: #2e7d4f; --ok-soft: #e7f4ec;
  --warn: #8a5a00; --warn-soft: #fff4cc; --err: #b42318; --err-soft: #fdecea; --dup-soft: #f0f1f3;
  --th: #eef2f7; --sel: #fff9e6;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 13px; color: var(--text); background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }

.topbar { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--head); color: var(--head-text); flex: none; }
.brand { font-weight: 700; font-size: 15px; letter-spacing: -0.2px; white-space: nowrap; }
.brand .ver { font-weight: 400; font-size: 11px; opacity: .6; margin-left: 4px; }
.folder { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.folder-label { font-size: 11px; opacity: .65; white-space: nowrap; }
#folderName { background: rgba(255,255,255,.1); padding: 4px 10px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 420px; }
.top-actions { display: flex; gap: 6px; }
.topbar .btn { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.18); color: #fff; }
.topbar .btn:hover:not(:disabled) { background: rgba(255,255,255,.22); }

.btn { border: 1px solid var(--line-strong); background: var(--panel); padding: 6px 12px; border-radius: 5px; cursor: pointer; white-space: nowrap; line-height: 1.2; }
.btn:hover:not(:disabled) { background: #f0f3f8; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #194f92; }
.btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn.link { border: none; background: none; color: var(--accent); padding: 2px 4px; text-decoration: underline; }

.toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
.toolbar input[type=search] { width: 300px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 5px; }
.toolbar select { padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: 5px; background: #fff; }
.chk { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
.spacer { flex: 1; }
.colpick { position: relative; }
.popover { position: absolute; right: 0; top: calc(100% + 4px); background: #fff; border: 1px solid var(--line-strong); border-radius: 6px; box-shadow: 0 8px 24px rgba(16,24,40,.14); padding: 10px; z-index: 30; width: 360px; }
.popover .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-bottom: 8px; }
.popover .cols label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.popover .pop-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 8px; }

.main { flex: 1; display: flex; min-height: 0; }
.tablewrap { flex: 1; overflow: auto; position: relative; background: var(--panel); }
.empty { padding: 48px 32px; color: var(--muted); max-width: 760px; line-height: 1.7; }
.empty h2 { color: var(--text); font-size: 18px; margin: 0 0 12px; }
.empty ol { padding-left: 20px; margin: 8px 0 20px; }
.empty .btn { margin-right: 6px; }
.notice { border: 1px solid #f3d27a; background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 14px 16px; }

table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
thead th { position: sticky; top: 0; z-index: 5; background: var(--th); border-bottom: 1px solid var(--line-strong); border-right: 1px solid var(--line); padding: 7px 8px; text-align: left; font-weight: 600; white-space: nowrap; cursor: pointer; user-select: none; }
thead th.sorted::after { content: attr(data-dir); color: var(--accent); margin-left: 4px; font-size: 10px; }
thead th.c-chk, td.c-chk { position: sticky; left: 0; z-index: 4; text-align: center; width: 54px; min-width: 54px; }
thead th.c-chk { z-index: 6; cursor: default; }
td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 5px 8px; vertical-align: top; background: #fff; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.wrap { white-space: normal; }
td.c-chk { background: #fbfcfd; }
tr.grp-first td { border-top: 1px solid var(--line-strong); }
tbody tr:hover td { background: #f6f9fd; }
tr.is-checked td, tr.is-checked td.c-chk { background: var(--ok-soft); }
tr.is-done td { color: #475467; }
tr.is-dup td { background: var(--dup-soft); color: #8a94a6; }
tr.is-err td { background: var(--err-soft); }
tr.is-sel td { background: var(--sel) !important; }
td.cell-warn { background: var(--warn-soft) !important; color: var(--warn); font-weight: 600; }
td.c-warn { color: var(--warn); max-width: 360px; }
td.c-warn.err { color: var(--err); }
.badge { display: inline-block; font-size: 10px; line-height: 1; padding: 2px 4px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); margin-left: 4px; vertical-align: 1px; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--ok); }
.muted { color: var(--muted); }

.detail { width: 460px; flex: none; border-left: 1px solid var(--line-strong); background: #fbfcfe; display: flex; flex-direction: column; min-height: 0; }
.detail-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-start; background: #fff; }
.detail-head h3 { margin: 0; font-size: 14px; line-height: 1.45; flex: 1; }
.detail-body { padding: 12px 14px; overflow: auto; flex: 1; }
.detail-foot { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; background: #fff; }
.detail dl { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; margin: 0 0 12px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; word-break: break-all; }
.detail h4 { margin: 16px 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .2px; }
.detail .warnlist { margin: 0 0 8px; padding: 8px 10px 8px 26px; background: var(--warn-soft); color: var(--warn); border-radius: 5px; }
.mini { width: 100%; border-collapse: collapse; font-size: 12px; }
.mini th, .mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; white-space: normal; max-width: none; position: static; background: #fff; }
.mini th { background: var(--th); font-weight: 600; cursor: default; }
.paras p { margin: 0 0 6px; line-height: 1.6; }
.paras mark { background: #ffe58a; padding: 0 1px; }

.bottombar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--panel); border-top: 1px solid var(--line-strong); flex: none; }
.stats { color: var(--muted); white-space: nowrap; }
.stats b { color: var(--text); }

.busy { position: fixed; inset: 0; background: rgba(15,23,42,.28); display: flex; align-items: center; justify-content: center; z-index: 50; }
.busy-box { background: #fff; padding: 22px 30px; border-radius: 8px; display: flex; gap: 14px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
.spinner { width: 22px; height: 22px; border: 3px solid #d0d7e2; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.modal { position: fixed; inset: 0; background: rgba(15,23,42,.35); display: flex; align-items: center; justify-content: center; z-index: 60; }
.modal-box { background: #fff; border-radius: 8px; width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 64px); display: flex; flex-direction: column; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
.modal-box h3 { margin: 0; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 15px; }
.modal-body { padding: 14px 18px; overflow: auto; line-height: 1.65; }
.modal-body ul.flist { max-height: 240px; overflow: auto; background: #f7f9fc; border: 1px solid var(--line); border-radius: 5px; padding: 8px 8px 8px 26px; margin: 8px 0; }
.modal-body .res-ok { color: var(--ok); }
.modal-body .res-err { color: var(--err); }
.modal-body h4 { margin: 14px 0 4px; }
.modal-actions { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }

.toast { position: fixed; right: 20px; bottom: 64px; max-width: 460px; background: #1f2b3a; color: #fff; padding: 10px 14px; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 70; line-height: 1.5; }
.toast.err { background: var(--err); }

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">검사의뢰 공문 추출기 <span class="ver">v1.0</span></div>
  <div class="folder" id="folderBox"><span class="folder-label">공문 폴더</span><span id="folderName">연결 안 됨</span></div>
  <div class="top-actions">
    <button id="btnPick" class="btn">공문 폴더 선택</button>
    <button id="btnRefresh" class="btn" disabled>새로고침</button>
    <button id="btnHelp" class="btn ghost" title="사용 방법">도움말</button>
  </div>
</header>

<section class="toolbar" id="toolbar" hidden>
  <input id="fSearch" type="search" placeholder="검색 (시료번호·기관·항목·파일명 등)" autocomplete="off">
  <select id="fOrg"><option value="">기관 전체</option></select>
  <select id="fState">
    <option value="pending">처리 대기 공문 전체</option>
    <option value="unchecked">완료 체크 안 한 공문</option>
    <option value="checked">완료 체크한 공문</option>
    <option value="done">성적처리완료 폴더</option>
  </select>
  <label class="chk"><input id="fWarn" type="checkbox"> 확인필요만</label>
  <div class="spacer"></div>
  <div class="colpick">
    <button id="btnCols" class="btn small">열 선택</button>
    <div id="colMenu" class="popover" hidden></div>
  </div>
</section>

<main class="main">
  <div class="tablewrap" id="tableWrap">
    <div id="emptyBox" class="empty"></div>
    <table id="grid" hidden><thead></thead><tbody></tbody></table>
  </div>
  <aside id="detail" class="detail" hidden></aside>
</main>

<footer class="bottombar" id="bottombar" hidden>
  <button id="btnDone" class="btn primary" disabled>완료 체크한 공문 처리 완료 (0)</button>
  <button id="btnExcel" class="btn">엑셀 저장</button>
  <button id="btnStd" class="btn ghost">기준표 양식 만들기</button>
  <div class="spacer"></div>
  <div id="stats" class="stats"></div>
</footer>

<div id="busy" class="busy" hidden><div class="busy-box"><div class="spinner"></div><div id="busyText">공문 읽는 중…</div></div></div>
<div id="modal" class="modal" hidden><div class="modal-box"><h3 id="modalTitle"></h3><div id="modalBody" class="modal-body"></div><div class="modal-actions"><button id="modalCancel" class="btn">취소</button><button id="modalOk" class="btn primary">확인</button></div></div></div>
<div id="toast" class="toast" hidden></div>

<script>
/* 검사의뢰 공문(ODT) 추출 엔진 v1.0 — 외부 라이브러리 없음 (브라우저·Node 공용) */
(function (global) {
'use strict';

/* ───────── 1. ZIP 읽기 ───────── */
// inflateRaw: (Uint8Array) => Promise<Uint8Array>   브라우저: DecompressionStream('deflate-raw') / Node: zlib
async function unzipEntry(bytes, name, inflateRaw, optional) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 66000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('ZIP 구조가 아님(손상되었거나 ODT 파일이 아님)');
  const n = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const td = new TextDecoder('utf-8');
  for (let i = 0; i < n; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const fl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const lo = dv.getUint32(p + 42, true);
    const fn = td.decode(bytes.subarray(p + 46, p + 46 + fl));
    if (fn === name) {
      const lfl = dv.getUint16(lo + 26, true), lel = dv.getUint16(lo + 28, true);
      const data = bytes.subarray(lo + 30 + lfl + lel, lo + 30 + lfl + lel + csize);
      const out = method === 0 ? data : await inflateRaw(data);
      return td.decode(out);
    }
    p += 46 + fl + el + cl;
  }
  if (optional) return null;
  throw new Error(name + ' 없음(ODT 파일이 아님)');
}

/* ───────── 2. XML 파서 (경량) ───────── */
const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" };
const dec = t => t.indexOf('&') < 0 ? t : t.replace(/&(#x[0-9a-fA-F]+|#\d+|\w+);/g, (m, e) =>
  e[0] === '#' ? String.fromCodePoint(e[1] === 'x' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10)) : (ENT[e] != null ? ENT[e] : m));
const local = q => { const k = q.indexOf(':'); return k < 0 ? q : q.slice(k + 1); };
function parseXML(s) {
  const root = { n: '#root', a: {}, c: [] }, st = [root]; let i = 0; const L = s.length;
  while (i < L) {
    const lt = s.indexOf('<', i); if (lt < 0) break;
    if (lt > i) st[st.length - 1].c.push(dec(s.slice(i, lt)));
    const c1 = s[lt + 1];
    if (c1 === '?') { i = s.indexOf('?>', lt) + 2; continue; }
    if (c1 === '!') {
      if (s.startsWith('<!--', lt)) i = s.indexOf('-->', lt) + 3;
      else if (s.startsWith('<![CDATA[', lt)) { const e = s.indexOf(']]>', lt); st[st.length - 1].c.push(s.slice(lt + 9, e)); i = e + 3; }
      else i = s.indexOf('>', lt) + 1;
      continue;
    }
    let j = lt + 1, q = null;
    for (; j < L; j++) { const ch = s[j]; if (q) { if (ch === q) q = null; } else if (ch === '"' || ch === "'") q = ch; else if (ch === '>') break; }
    let body = s.slice(lt + 1, j); i = j + 1;
    if (body[0] === '/') { if (st.length > 1) st.pop(); continue; }
    let self = false; if (body.endsWith('/')) { self = true; body = body.slice(0, -1); }
    const qn = /^\S+/.exec(body)[0];
    const a = {}, re = /([^\s=]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g; re.lastIndex = qn.length; let m;
    while ((m = re.exec(body))) a[local(m[1])] = dec(m[2] != null ? m[2] : m[3]);
    const node = { n: local(qn), a, c: [] };
    st[st.length - 1].c.push(node); if (!self) st.push(node);
  }
  return root;
}
const kids = (e, n) => e.c.filter(x => typeof x !== 'string' && (!n || x.n === n));
function walk(e, fn) { for (const x of e.c) { if (typeof x === 'string') continue; if (fn(x) === false) continue; walk(x, fn); } }
function findAll(e, n) { const r = []; walk(e, x => { if (x.n === n) r.push(x); }); return r; }
function has(e, n) { let f = false; walk(e, x => { if (x.n === n) f = true; }); return f; }
const textAll = e => e.c.map(x => typeof x === 'string' ? x : textAll(x)).join('');

/* ───────── 3. 텍스트 ───────── */
function inlineText(e) {
  let out = '';
  for (const x of e.c) {
    if (typeof x === 'string') { out += x.replace(/[\t\r\n ]+/g, ' '); continue; }
    switch (x.n) {
      case 's': out += ' '.repeat(+x.a.c || 1); break;
      case 'tab': out += '\t'; break;
      case 'line-break': out += '\n'; break;
      case 'frame': case 'note': case 'annotation': case 'table': break;
      default: out += inlineText(x);
    }
  }
  return out;
}
function blockLines(e) {
  const lines = [];
  for (const x of kids(e)) {
    if (x.n === 'p' || x.n === 'h') inlineText(x).split('\n').forEach(t => lines.push(t));
    else if (x.n === 'list' || x.n === 'list-item' || x.n === 'section') lines.push(...blockLines(x));
  }
  return lines.map(t => t.trim()).filter(Boolean);
}
const squash = t => (t || '').replace(/\s+/g, '');
function spacedName(t) {
  const toks = (t || '').trim().split(/\s+/).filter(Boolean);
  if (!toks.length) return '';
  return toks.every(x => x.length === 1) ? toks.join('') : toks.join(' ');
}

/* ───────── 4. 표 → 격자 (병합 처리) ───────── */
function tableRows(tbl) {
  const rows = [];
  (function collect(e) {
    for (const x of kids(e)) {
      if (x.n === 'table-row') { const rep = Math.min(+x.a['number-rows-repeated'] || 1, 3); for (let k = 0; k < rep; k++) rows.push(x); }
      else if (x.n === 'table-header-rows' || x.n === 'table-rows' || x.n === 'table-row-group') collect(x);
    }
  })(tbl);
  return rows;
}
function buildGrid(tbl) {
  const rows = tableRows(tbl), G = [];
  let ncols = 0;
  rows.forEach((row, r) => {
    G[r] = G[r] || []; let c = 0;
    for (const cell of kids(row)) {
      if (cell.n !== 'table-cell' && cell.n !== 'covered-table-cell') continue;
      const rep = Math.min(+cell.a['number-columns-repeated'] || 1, 64);
      for (let k = 0; k < rep; k++, c++) {
        if (cell.n !== 'table-cell') continue;
        if (G[r][c]) continue;
        const o = { r, c, rs: +cell.a['number-rows-spanned'] || 1, cs: +cell.a['number-columns-spanned'] || 1,
          lines: blockLines(cell), nested: has(cell, 'table') };
        o.text = o.lines.join('\n');
        for (let dr = 0; dr < o.rs; dr++) for (let dc = 0; dc < o.cs; dc++) {
          G[r + dr] = G[r + dr] || []; if (!G[r + dr][c + dc]) G[r + dr][c + dc] = o;
        }
      }
      ncols = Math.max(ncols, c);
    }
  });
  return { G, nrows: rows.length, ncols };
}
function rowOrigins(grid, r) {
  const out = [], seen = new Set();
  for (const o of grid.G[r] || []) if (o && !seen.has(o)) { seen.add(o); out.push(o); }
  return out;
}
const gridText = grid => grid.G.map((_, r) => rowOrigins(grid, r).map(o => o.text).join('|')).join('\n');

/* ───────── 5. 날짜 ───────── */
const DATE_RE = /(?:(\d{4})|'(\d{2}))\s*(?:[.\-\/]|년)\s*(\d{1,2})\s*(?:[.\-\/]|월)\s*(\d{1,2})(?!\d)\s*(?:\.|일)?/;
const pad = n => String(n).padStart(2, '0');
function parseDate(s) {
  if (!s) return null;
  const m = DATE_RE.exec(s); if (!m) return null;
  const y = m[1] || ('20' + m[2]), mo = +m[3], d = +m[4];
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  const rest = s.slice(m.index + m[0].length);
  const t = /(\d{1,2})\s*:\s*(\d{2})/.exec(rest);
  return { date: `${y}-${pad(mo)}-${pad(d)}`, time: t ? `${pad(t[1])}:${t[2]}` : '' };
}
function allDates(s) {
  const re = new RegExp(DATE_RE.source, 'g'), out = []; let m;
  while ((m = re.exec(s))) { const p = parseDate(m[0]); if (p) out.push({ ...p, index: m.index, end: m.index + m[0].length }); }
  return out;
}

/* ───────── 6. 사전 (설정) — 새 표기가 나오면 여기에 한 줄 추가 ───────── */
const ITEM_DICT = {
  'bod': 'BOD', 'toc': 'TOC', 'ss': 'SS', 'cod': 'COD',
  't-n': 'T-N', 'tn': 'T-N', '총질소': 'T-N',
  't-p': 'T-P', 'tp': 'T-P', '총인': 'T-P',
  'n-h(광)': 'n-H(광)', 'n-h(광유류)': 'n-H(광)', '노르말헥산(광유류)': 'n-H(광)', '노르말헥산(광)': 'n-H(광)',
  'n-h(동식)': 'n-H(동식)', 'n-h(동식물유류)': 'n-H(동식)', '노르말헥산(동식물유류)': 'n-H(동식)',
  'abs': 'ABS', '음이온계면활성제': 'ABS',
  '생태독성': '생태독성', '색도': '색도', '철': '철', 'ph': 'pH', '수소이온농도': 'pH',
  '대장균군': '대장균군', '총대장균군': '총대장균군', '페놀류': '페놀류', '시안': '시안', '구리': '구리', '아연': '아연',
  '납': '납', '카드뮴': '카드뮴', '크롬': '크롬', '6가크롬': '6가크롬', '비소': '비소', '수은': '수은', '망간': '망간', '불소': '불소',
};
const SIDO_TITLE = { '시': '시장', '군': '군수', '도': '도지사' };
const ORG_EXCEPTIONS = {}; // 예: { '○○사업소': { 의뢰기관: '○○시', 의뢰자: '○○시장' } }
const REGION_CODE = /^(가|나|다|라|청정|특례|특정)(지역)?$/;
function normItem(tok) { return ITEM_DICT[String(tok || '').toLowerCase().replace(/\s+/g, '')] || null; }

/* ───────── 7. 헤더 분류 ───────── */
function classify(h) {
  const t = squash(h);
  if (!t) return null;
  if (/^(연번|순번|번호|no\.?)$/i.test(t)) return 'seq';
  if (/(시료|지시|의뢰)번호/.test(t)) return 'sampleNo';
  if (/항목/.test(t)) return /기준/.test(t) ? 'itemsStd' : 'items';
  if (/(채취|채수)(일|일자|일시|날짜)/.test(t)) return 'date';
  if (/지역/.test(t)) return 'region';
  if (/기준/.test(t)) return 'std';
  if (/(시료량|채취량|채수량|수량)/.test(t) || t === '시료') return 'qty';
  if (/(업종|배출시설|성상|건물용도)/.test(t)) return 'industry';
  if (/지점/.test(t)) return 'point';
  if (/비고/.test(t)) return 'note';
  return 'other';
}

/* ───────── 8. 상단·하단 ───────── */
function parseHeader(tables) {
  for (const t of tables) {
    const g = buildGrid(t);
    let rRecv = -1, title = '', org = '';
    for (let r = 0; r < g.nrows; r++) {
      const os = rowOrigins(g, r);
      os.forEach((o, k) => {
        if (squash(o.text) === '수신' && rRecv < 0) rRecv = r;
        if (squash(o.text) === '제목' && os[k + 1]) title = os[k + 1].lines.join(' ');
      });
    }
    if (rRecv < 0 || !title) continue;
    for (let r = 0; r < rRecv; r++) for (const o of rowOrigins(g, r)) {
      const s = squash(o.text);
      if (s && /^[가-힣]+$/.test(s) && s.length <= 15) org = s;
    }
    return { org, title: title.trim() };
  }
  return null;
}
function parseFooter(tables) {
  for (const t of tables) {
    const g = buildGrid(t);
    let rSi = -1, rCoop = -1;
    for (let r = 0; r < g.nrows; r++) for (const o of rowOrigins(g, r)) {
      const s = squash(o.text);
      if (s === '시행' && rSi < 0) rSi = r;
      if (s === '협조자' && rCoop < 0) rCoop = r;
    }
    if (rSi < 0) continue;
    const f = {};
    const nextVals = (r, label) => { const os = rowOrigins(g, r).filter(o => o.text); const k = os.findIndex(o => squash(o.text) === label); return k < 0 ? [] : os.slice(k + 1).map(o => o.text.trim()); };
    let v = nextVals(rSi, '시행'); f.siNo = v[0] || ''; f.siDate = v[1] || '';
    v = nextVals(rSi, '접수'); f.rcNo = v[0] || ''; f.rcDate = v[1] || '';
    if (rCoop > 1) {
      const names = rowOrigins(g, rCoop - 1).filter(o => o.r === rCoop - 1 && o.text && !/결|\d/.test(o.text));
      const posRow = rowOrigins(g, rCoop - 2).filter(o => o.r === rCoop - 2 && o.text);
      f.drafter = names[0] ? names[0].text.trim() : '';
      f.drafterPos = posRow[0] ? posRow[0].text.trim() : '';
      for (let r = 0; r < rCoop - 2; r++) for (const o of rowOrigins(g, r)) if (o.text && !o.nested) f.sender = spacedName(o.text);
    }
    for (let r = 0; r < g.nrows; r++) {
      const os = rowOrigins(g, r).filter(o => o.text).map(o => o.text.trim());
      if (os[0] === '우') { f.zip = os[1] || ''; f.addr = os[2] || ''; }
      const k = os.indexOf('전화번호'); if (k >= 0) f.tel = os[k + 1] || '';
      const kf = os.indexOf('팩스번호'); if (kf >= 0) f.fax = os[kf + 1] || '';
      const em = os.find(x => x.includes('@')); if (em) f.email = em;
    }
    return f;
  }
  return null;
}
function senderFallback(body, posFirst) {
  const cells = [];
  walk(body, x => { if (x.n === 'table-cell' && !has(x, 'table')) { const t = blockLines(x).join(' '); if (t) cells.push(t); return false; } });
  const k = cells.findIndex(t => squash(t) === squash(posFirst));
  return k > 0 ? spacedName(cells[k - 1]) : '';
}
function deriveOrg(orgTop, addr) {
  if (ORG_EXCEPTIONS[orgTop]) return ORG_EXCEPTIONS[orgTop];
  let org = '';
  if (/^[가-힣]{1,4}(시|군)$/.test(orgTop) || /^[가-힣]{1,3}도$/.test(orgTop)) org = orgTop;
  else { const m = /(?:^|\s)([가-힣]{1,4}(?:시|군))(?=\s)/.exec(addr || ''); if (m) org = m[1]; }
  if (!org) return { 의뢰기관: orgTop, 의뢰자: '' };
  return { 의뢰기관: org, 의뢰자: org.slice(0, -1) + SIDO_TITLE[org.slice(-1)] };
}

/* ───────── 9. 시료 표 ───────── */
function findSampleTables(tables) {
  const out = [], sigs = new Set();
  for (const t of tables) {
    const g = buildGrid(t);
    for (let r = 0; r < Math.min(3, g.nrows); r++) {
      if (!rowOrigins(g, r).some(o => classify(o.text) === 'sampleNo')) continue;
      const sig = gridText(g); if (sigs.has(sig)) break; sigs.add(sig);
      out.push({ g, hr: r }); break;
    }
  }
  return out;
}
function joinNo(lines) {
  let s = '';
  for (const l of lines) s += (s && !/[-~]$/.test(s) && !/^[-~]/.test(l) ? ' ' : '') + l;
  return s.trim();
}
function readSampleTable({ g, hr }) {
  const heads = rowOrigins(g, hr).map(o => ({ o, f: classify(o.text), name: spacedName(o.text.replace(/\n/g, ' ')) }));
  const samples = [];
  const raw = [];
  for (let r = hr; r < g.nrows; r++) raw.push(heads.map(h => {
    const set = []; for (let c = h.o.c; c < h.o.c + h.o.cs; c++) { const o = g.G[r] && g.G[r][c]; if (o && !set.includes(o)) set.push(o); }
    return set.map(o => o.lines.join(' ')).join(' / ');
  }));
  const valOf = (r, h) => {
    const set = []; for (let c = h.o.c; c < h.o.c + h.o.cs; c++) { const o = g.G[r] && g.G[r][c]; if (o && o.r !== hr && !set.includes(o)) set.push(o); }
    return set;
  };
  for (let r = hr + 1; r < g.nrows; r++) {
    const rec = {}; let noCell = null, any = false;
    for (const h of heads) {
      if (!h.f || h.f === 'seq') continue;
      const cells = valOf(r, h);
      const text = cells.map(o => o.text).filter(Boolean).join('\n');
      if (h.f === 'sampleNo') { noCell = cells[0] || null; rec._noLines = noCell ? noCell.lines : []; }
      if (text) any = true;
      if (h.f === 'other') { if (text) (rec.other = rec.other || []).push(h.name + ': ' + text.replace(/\n/g, ' ')); }
      else rec[h.f] = rec[h.f] ? rec[h.f] + '\n' + text : text;
    }
    if (!any) continue;
    const cont = !noCell || !noCell.text || noCell.r < r;
    if (/^[-–—]$/.test((rec.note || '').trim())) rec.note = '';
    if (!rec.region && REGION_CODE.test(squash(rec.note))) { rec.region = rec.note.trim(); rec.note = ''; }
    const group = { items: rec.items || rec.itemsStd || '', std: rec.std || '', region: rec.region || '' };
    if (cont) { if (samples.length) samples[samples.length - 1].groups.push(group); continue; }
    samples.push({ rawNo: joinNo(rec._noLines || []), groups: [group], date: rec.date || '', qty: rec.qty || '',
      industry: rec.industry || '', point: rec.point || '', note: rec.note || '', other: (rec.other || []).join(' / ') });
  }
  return { headers: heads.map(h => h.name), raw, samples };
}
function expandNo(raw) {
  let s = raw.replace(/\s*\n\s*/g, '').trim();
  let subs = null;
  const sm = /\(\s*([A-Za-z])\s*~\s*([A-Za-z])\s*\)\s*$/.exec(s);
  if (sm) {
    s = s.slice(0, sm.index).trim(); subs = [];
    for (let c = sm[1].toUpperCase().charCodeAt(0); c <= sm[2].toUpperCase().charCodeAt(0); c++) subs.push(String.fromCharCode(c));
  }
  let bases = [s];
  const rm = /^(.*?)(\d+)\s*~\s*(?:[0-9A-Za-z가-힣\-]*-)?(\d+)$/.exec(s);
  if (rm) { const a = +rm[2], b = +rm[3]; if (b > a && b - a < 200) { bases = []; for (let k = a; k <= b; k++) bases.push(rm[1] + k); } }
  const out = [];
  for (const b of bases) { if (subs) subs.forEach(x => out.push(`${b}(${x})`)); else out.push(b); }
  return { list: out, baseCount: bases.length };
}
function parseItems(text) {
  let region = '';
  let s = (text || '').replace(/[·•▪◦]/g, ',');
  const ar = /(?:→|->|⇒)\s*([^,\n]+)/.exec(s);
  if (ar) { region = ar[1].trim(); s = s.slice(0, ar.index) + s.slice(ar.index + ar[0].length); }
  s = s.replace(/\n/g, ',');
  const toks = []; let depth = 0, cur = '';
  for (const ch of s) {
    if (ch === '(' || ch === '（') depth++; else if (ch === ')' || ch === '）') depth = Math.max(0, depth - 1);
    if ((ch === ',' || ch === '，' || ch === '、') && depth === 0) { toks.push(cur); cur = ''; } else cur += ch;
  }
  toks.push(cur);
  const items = [];
  for (let t of toks) {
    t = t.replace(/^[\s\-–]+/, '').trim(); if (!t) continue;
    let std = '';
    const m = /^(.*\S)\s*\(\s*([\d.]+)\s*\)$/.exec(t);
    if (m) { t = m[1]; std = m[2]; }
    const name = normItem(t);
    items.push({ raw: t, name: name || t, known: !!name, std });
  }
  return { items, region };
}
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function applyStdColumn(items, std) {
  if (!std) return;
  const v = std.replace(/\n/g, ' ');
  const each = /각\s*([\d.]+)/.exec(v);
  if (each) { items.forEach(i => { if (!i.std) i.std = each[1]; }); return; }
  let hit = false;
  for (const i of items) {
    for (const key of new Set([i.raw, i.name])) {
      const m = new RegExp(esc(key) + '\\s*[:：]?\\s*([\\d.]+)', 'i').exec(v);
      if (m) { if (!i.std) i.std = m[1]; hit = true; break; }
    }
  }
  if (hit) return;
  const nums = v.match(/\d+(?:\.\d+)?/g) || [];
  if (nums.length === items.length) items.forEach((i, k) => { if (!i.std) i.std = nums[k]; });
}

/* ───────── 10. 본문 채취일 ───────── */
function bodyParagraphs(body) {
  const out = [];
  for (const x of kids(body)) {
    if (x.n === 'p' || x.n === 'h') { const t = inlineText(x).replace(/\s+/g, ' ').trim(); if (t) out.push(t); }
    else if (x.n === 'list' || x.n === 'list-item' || x.n === 'section') out.push(...bodyParagraphs(x));
  }
  return out;
}
function dateFromBody(paras) {
  const found = [];
  for (const p of paras) for (const d of allDates(p)) {
    const before = p.slice(Math.max(0, d.index - 25), d.index), after = p.slice(d.end, d.end + 45);
    if (/의뢰\s*(일|일자)/.test(before)) continue;
    if (/(채수|채취|채집)/.test(after) || /(채수|채취)[^.。]{0,15}$/.test(before)) found.push(d);
  }
  return found;
}

/* ───────── 11. 제목 대조 ───────── */
function titleCheck(title, samples, baseTotal) {
  const m = /[(\[]([^()\[\]]*\d[^()\[\]]*)[)\]]\s*$/.exec(title || '');
  if (!m || !samples.length) return '';
  const code = m[1];
  let exp = null;
  const n = /등\s*(\d+)\s*건/.exec(code);
  if (n) exp = +n[1];
  else {
    const r = /(\d+)\s*~\s*(?:[0-9A-Za-z가-힣\-]*-)?(\d+)/.exec(code);
    if (r) exp = +r[2] - +r[1] + 1;
    else {
      const S = squash(samples[0].rawNo).replace(/\([A-Z]~[A-Z]\)/i, ''), C = squash(code);
      const x = new RegExp('^' + esc(S) + '-(\\d+)$').exec(C);
      if (x) exp = +x[1] - +(/(\d+)$/.exec(S) || [0, 0])[1] + 1;
      else if (C.replace(/-/g, '').includes(S.replace(/-/g, ''))) exp = 1;
      else return `제목 시료번호(${code})와 표 시료번호 다름`;
    }
  }
  return exp != null && exp !== baseTotal ? `제목 시료 수(${exp})와 표(${baseTotal}) 다름` : '';
}

/* ───────── 12. 메인 ───────── */
async function extractOdt(bytes, fileName, inflateRaw) {
  const xml = await unzipEntry(bytes, 'content.xml', inflateRaw);
  const root = parseXML(xml);
  const officeBody = findAll(root, 'body')[0];
  const body = (officeBody && kids(officeBody, 'text')[0]) || root;
  const tables = findAll(body, 'table').filter(t => !findAll(t, 'table').length); // 중첩 없는 표만
  const hdr = parseHeader(tables) || { org: '', title: '' };
  const ftr = parseFooter(tables) || {};
  if (!ftr.sender && ftr.drafterPos) ftr.sender = senderFallback(body, ftr.drafterPos);
  const org = deriveOrg(hdr.org, ftr.addr);
  const paras = bodyParagraphs(body);
  const docWarn = [];
  const doc = {
    파일명: (fileName || '').normalize('NFC'), 제목: hdr.title, 상단기관명: hdr.org,
    의뢰기관: org.의뢰기관, 의뢰자: org.의뢰자, 발신명의: ftr.sender || '',
    시행: ftr.siNo || '', 시행일: (parseDate(ftr.siDate) || {}).date || '',
    접수: ftr.rcNo || '', 접수일: (parseDate(ftr.rcDate) || {}).date || '',
    시료채취자: ftr.drafter || '', 기안자직위: ftr.drafterPos || '',
    우편번호: ftr.zip || '', 주소: ftr.addr || '', 전화번호: ftr.tel || '', 이메일: ftr.email || '',
  };
  if (!doc.접수) docWarn.push('접수번호 없음');
  if (!doc.의뢰자) docWarn.push('의뢰자 판정 불가');
  const sts = findSampleTables(tables);
  if (!sts.length) docWarn.push('시료표 미인식');
  const bodyDates = dateFromBody(paras);
  const bodyDate = bodyDates[0] || null;
  const bset = [...new Set(bodyDates.map(d => d.date))];
  if (bset.length > 1) docWarn.push('본문 채취일 여러 개: ' + bset.join(', '));
  const rows = [], allSamples = [], tableInfo = []; let baseTotal = 0;
  for (const st of sts) {
    const { headers, raw, samples } = readSampleTable(st);
    tableInfo.push({ headers, raw });
    for (const s of samples) {
      const ex = expandNo(s.rawNo); baseTotal += ex.baseCount; allSamples.push(s);
      const warn = [];
      const groups = s.groups.map(gp => {
        const p = parseItems(gp.items);
        let std = gp.std, region = gp.region;
        if (std && !/\d/.test(std)) { region = region || std; std = ''; } // '수질기준' 열에 지역코드가 들어간 경우
        applyStdColumn(p.items, std);
        const rg = (region || p.region || '').replace(/\s*\n\s*/g, ' ').trim();
        p.items.forEach(i => { i.region = rg; });
        return { items: p.items, region: rg };
      });
      const items = [];
      groups.forEach(gp => gp.items.forEach(i => { if (!items.some(x => x.name === i.name)) items.push(i); }));
      if (/기준/.test(s.note)) applyStdColumn(items, s.note);
      const unknown = items.filter(i => !i.known).map(i => i.raw);
      if (unknown.length) warn.push('미등록 항목: ' + unknown.join(', '));
      if (!items.length) warn.push('검사항목 없음');
      const regs = groups.map(gp => gp.region).filter(Boolean);
      const regionText = new Set(regs).size > 1
        ? groups.filter(gp => gp.region).map(gp => `${gp.region}(${gp.items.map(i => i.name).join(', ')})`).join(' / ')
        : (regs[0] || '');
      let date, time = '', src;
      const pd = parseDate(s.date);
      if (pd) { date = pd.date; time = pd.time; src = '표'; }
      else if (bodyDate) { date = bodyDate.date; time = bodyDate.time; src = '본문'; }
      else { date = '채취일자 확인 필요'; src = '확인필요'; warn.push('채취일자 확인 필요'); }
      if (pd && doc.접수일 && pd.date > doc.접수일) warn.push('채취일이 접수일보다 늦음');
      for (const no of ex.list) {
        const row = {
          ...doc, 시료번호: no, 시료번호원문: s.rawNo,
          검사항목: items.map(i => i.name).join(', '),
          기준: '', 기준출처: '',
          지역구분: regionText, 시료채취일: date, 채취시각: time, 채취일출처: src,
          '업종/성상': spacedName(s.industry.replace(/\n/g, ' ')), 시료량: s.qty.replace(/\n/g, ', '),
          채취지점: s.point.replace(/\n/g, ' '), 비고: s.note.replace(/\n/g, ' '), 기타: s.other,
          _items: items.map(i => ({ name: i.name, region: i.region || regionText, stdDoc: i.std || '', std: i.std || '', src: i.std ? '공문' : '' })),
          _warn: warn,
        };
        refreshStdText(row);
        rows.push(row);
      }
    }
  }
  const tc = titleCheck(hdr.title, allSamples, baseTotal); if (tc) docWarn.push(tc);
  if (doc.시행일 && doc.접수일 && doc.접수일 < doc.시행일) docWarn.push('접수일이 시행일보다 빠름');
  if (!rows.length) rows.push({ ...doc, 시료번호: '', _items: [], _warn: [] });
  rows.forEach(r => { r._baseWarn = [...docWarn, ...r._warn]; delete r._warn; r.확인필요 = r._baseWarn.join(' / '); });
  return { doc: { ...doc, 본문: paras }, rows, warnings: docWarn, tables: tableInfo };
}

const COLUMNS = ['접수','접수일','의뢰기관','의뢰자','발신명의','시행','시행일','제목','시료번호','검사항목','기준','기준출처','지역구분',
  '시료채취일','채취시각','채취일출처','시료채취자','업종/성상','시료량','채취지점','비고','기타','우편번호','주소','전화번호','이메일','확인필요','파일명'];

/* ───────── 13. 중복 공문 ───────── */
function markDuplicates(results) {

/* ───── 처리상태 파일 (_처리상태.json) ───── */

/* ───── 폴더 읽기 ───── */
async function listFiles(dir) {

    if (nm.startsWith('~$') || nm.startsWith('.')) continue;
    if (/\.odt$/i.test(nm)) odt.push({ name, nm, handle: h });

  const d = { id: ck, name: en.name, nm: en.nm, loc, size: file.size };

    d.result = await E.extractOdt(new Uint8Array(await file.arrayBuffer()), en.nm, inflateRaw);

  d.key = d.result && d.result.doc.접수 ? d.result.doc.접수 : 'file:' + en.nm;

}

    else toast('폴더를 읽지 못했습니다: ' + explain(e), 'err');

  if (n === 'NotFoundError') return '파일이 이미 옮겨졌거나 없습니다. [새로고침] 후 다시 확인하세요.';
  if (n === 'NotAllowedError' || n === 'SecurityError') return '폴더 쓰기 권한이 없습니다. 폴더를 다시 연결해 주세요.';
  if (n === 'QuotaExceededError') return '저장 공간이 부족합니다.';
  return (e && e.message) || String(e);
}
async function exists(dir, name) { try { await dir.getFileHandle(name); return true; } catch (e) { return false; } }
async function uniqueName(dir, name) {
  if (!(await exists(dir, name))) return name;
  const dot = name.lastIndexOf('.'), base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
  for (let k = 2; k < 1000; k++) { const c = `${base} (${k})${ext}`; if (!(await exists(dir, c))) return c; }
  throw new Error('같은 이름의 파일이 너무 많습니다.');
}
// 복사 → 크기 확인 → 원본 삭제 (실패하면 복사본을 지우고 원본 유지)
async function moveFile(srcDir, name, dstDir) {
  const fh = await srcDir.getFileHandle(name); // 없으면 NotFoundError
  const target = await uniqueName(dstDir, name.normalize('NFC'));
  if (typeof fh.move === 'function') {
    try { await fh.move(dstDir, target); if (await exists(dstDir, target)) return target; } catch (e) { /* 아래 방식으로 다시 시도 */ }
    if (await exists(dstDir, target) && !(await exists(srcDir, name))) return target;
  }
  const file = await fh.getFile();
  const nh = await dstDir.getFileHandle(target, { create: true });
  try {
    const w = await nh.createWritable(); await w.write(file); await w.close();
    const copied = await nh.getFile();
    if (copied.size !== file.size) throw new Error('복사한 파일 크기가 원본과 다릅니다.');
  } catch (e) { await dstDir.removeEntry(target).catch(() => {}); throw e; }
  try { await srcDir.removeEntry(name); }
  catch (e) { await dstDir.removeEntry(target).catch(() => {}); throw e; }
  return target;
}
async function processChecked() {
  const groups = checkedGroups();
  if (!groups.length) return toast('완료 체크한 공문이 없습니다.');
  const files = groups.flatMap(g => g.docs);
  const ok = await modal('처리 완료', `<p>완료 체크한 공문 <b>${groups.length}건</b>(파일 ${files.length}개)을 <b>${DONE_DIR}</b> 폴더로 옮깁니다.</p><ul class="flist">${files.map(d => `<li>${esc(d.nm)}</li>`).join('')}</ul><p class="muted">옮긴 공문은 [성적처리완료 폴더] 보기에서 언제든 되돌릴 수 있습니다.</p>`, '옮기기');
  if (!ok) return;
  busy(true, '공문 옮기는 중…');
  const okList = [], failList = [];
  try {
    const doneDir = await getDoneDir(true);
    if (!doneDir) throw new Error(`${DONE_DIR} 폴더를 만들 수 없습니다.`);
    for (const g of groups) {
      const moved = []; let failed = false;
      for (const d of g.docs) {
        try { const to = await moveFile(state.root, d.name, doneDir); moved.push({ from: d.nm, to }); okList.push({ file: d.nm, to }); }
        catch (e) { failed = true; failList.push({ file: d.nm, msg: explain(e) }); }
      }
      if (moved.length) state.status.history.unshift({ at: nowIso(), action: '처리완료', key: g.key, files: moved });
      if (!failed) delete state.status.checked[g.key];
    }
    await writeStatus();
  } catch (e) { failList.push({ file: '(전체)', msg: explain(e) }); }
  busy(false);
  state.selected = null;
  await scan({ quiet: true });
  let html = `<p class="res-ok">옮긴 파일 <b>${okList.length}</b>개</p>`;
  if (okList.some(x => x.to !== x.file.normalize('NFC'))) html += `<p class="muted">같은 이름이 이미 있어 이름 뒤에 번호를 붙인 파일이 있습니다.</p>`;
  if (failList.length) html += `<h4 class="res-err">옮기지 못한 파일 ${failList.length}개</h4><ul class="flist">${failList.map(f => `<li><b>${esc(f.file)}</b><br>${esc(f.msg)}</li>`).join('')}</ul><p>실패한 공문은 완료 체크가 그대로 남아 있습니다. 원인을 해결한 뒤 다시 [처리 완료]를 누르세요.</p>`;
  await info('처리 완료 결과', html);
}
async function restore(d) {
  if (!d || d.loc !== 'done') return;
  const ok = await modal('되돌리기', `<p><b>${esc(d.nm)}</b><br>이 공문을 <b>${esc(state.root.name)}</b> 폴더로 되돌립니다. 완료 체크는 해제됩니다.</p>`, '되돌리기');
  if (!ok) return;
  busy(true, '되돌리는 중…');
  try {
    const doneDir = await getDoneDir(false);
    const to = await moveFile(doneDir, d.name, state.root);
    delete state.status.checked[d.key];
    state.status.history.unshift({ at: nowIso(), action: '되돌리기', key: d.key, files: [{ from: d.nm, to }] });
    await writeStatus();
    toast(`되돌렸습니다: ${to}`);
  } catch (e) { toast('되돌리지 못했습니다: ' + explain(e), 'err'); }
  busy(false); state.selected = null;
  await scan({ quiet: true });
}

/* ───── 엑셀 저장 ───── */
async function saveBytes(bytes, name) {
  const mime = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  if (window.showSaveFilePicker) {
    try {
      const h = await window.showSaveFilePicker({ id: 'odt-excel', suggestedName: name, types: [{ description: '엑셀 파일', accept: { [mime]: ['.xlsx'] } }] });
      const w = await h.createWritable(); await w.write(bytes); await w.close();
      toast(`저장했습니다: ${h.name}`); return true;
    } catch (e) {
      if (e.name === 'AbortError') return false;
      if (e.name === 'NoModificationAllowedError' || e.name === 'InvalidModificationError') { toast('같은 이름의 엑셀 파일이 열려 있어 저장할 수 없습니다. 엑셀을 닫거나 다른 이름으로 저장하세요.', 'err'); return false; }
    }
  }
  const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast(`다운로드 폴더에 저장했습니다: ${name}`); return true;
}
async function exportExcel() {
  const list = visibleDocs();
  if (!list.length) return toast('저장할 공문이 없습니다.');
  const header = ['상태', ...E.COLUMNS];
  const rows = [], meta = [];
  for (const d of list) {
    const st = d.loc === 'done' ? '처리완료' : isChecked(d) ? '완료체크' : '처리대기';
    for (const r of docRows(d)) { rows.push([st, ...E.COLUMNS.map(c => r[c] == null ? '' : r[c])]); meta.push({ dup: !!(d.result && d.result.duplicate), st }); }
  }
  const iWarn = header.indexOf('확인필요'), iDate = header.indexOf('시료채취일');
  const bytes = X.buildXlsx([{
    name: '공문추출', columns: header.map(h => ({ header: h, width: XLSX_W[h] || 12 })), rows,
    styleOf: (ri, k, v) => meta[ri].dup ? 3 : ((k === iWarn && v) || (k === iDate && v === '채취일자 확인 필요')) ? 2 : (k === 0 && meta[ri].st !== '처리대기') ? 4 : 0,
  }]);
  await saveBytes(bytes, `공문추출_${today()}.xlsx`);
}

/* ───── 기준표 양식 ───── */
const unitOf = item => ({ '생태독성': 'TU', '색도': '도', 'pH': '' })[item] != null ? ({ '생태독성': 'TU', '색도': '도', 'pH': '' })[item] : 'mg/L';
async function makeStdTemplate() {
  const results = [...state.docs, ...state.doneDocs].filter(d => d.result).map(d => d.result);
  const miss = E.missingStdPairs(results);
  const hasStd = !!state.stdFile;
  if (!miss.length) return toast(hasStd ? '기준이 비어 있는 항목이 없습니다.' : '공문이 없어 양식을 만들 수 없습니다.');
  const fname = hasStd ? '기준표_추가필요.xlsx' : '기준표.xlsx';
  const ok = await modal('기준표 양식 만들기', `<p>현재 공문에서 기준이 비어 있는 <b>지역구분 × 항목 ${miss.length}개</b>를 모아 <b>${esc(state.root.name)}\\${fname}</b> 파일을 만듭니다.</p>
    <ol><li>엑셀로 열어 <b>기준값</b> 칸을 채우고 저장합니다.</li>${hasStd ? `<li>채운 행을 기존 <b>${esc(state.stdFile)}</b>에 옮겨 붙이고 저장합니다.</li>` : ''}<li>엑셀을 닫고 이 화면에서 <b>새로고침</b>을 누르면 기준이 채워집니다.</li></ol>
    <p class="muted">지역구분을 비우거나 * 로 쓰면 모든 지역에 같은 기준을 적용합니다.</p>`, '만들기');
  if (!ok) return;
  const rows = miss.map(m => [m.지역구분, m.항목, '', unitOf(m.항목), `${m.건수}건 (예: ${m.예시})`]);
  const guide = [
    ['기준표 작성 방법'], ['1. [기준표] 시트의 기준값 칸을 채우고 저장합니다. (파일 이름은 반드시 기준표.xlsx)'],
    ['2. 지역구분은 공문에 적힌 값(가, 나, 청정, 특례, 기타, 하수처리구역내 등)을 그대로 씁니다.'],
    ['3. 지역구분을 비우거나 * 로 쓰면 모든 지역에 적용합니다. 같은 항목에 지역별 기준이 있으면 지역이 맞는 쪽이 우선입니다.'],
    ['4. 공문에 기준이 적혀 있으면 공문 값을 우선하고, 기준표는 빈 항목만 채웁니다.'],
    ['5. 항목 이름은 BOD, TOC, SS, T-N, T-P, n-H(광), ABS, 생태독성, 색도 등 프로그램 표준명을 씁니다. (총인·총질소 등도 인식)'],
  ];
  const bytes = X.buildXlsx([
    { name: '기준표', columns: [{ header: '지역구분', width: 30 }, { header: '항목', width: 14 }, { header: '기준값', width: 10 }, { header: '단위', width: 8 }, { header: '참고(해당 시료)', width: 26 }], rows, styleOf: (ri, k) => k === 2 ? 2 : 0 },
    { name: '작성 안내', columns: [{ header: '안내', width: 110 }], rows: guide },
  ]);
  try {
    const fh = await state.root.getFileHandle(fname, { create: true });
    const w = await fh.createWritable(); await w.write(bytes); await w.close();
    await info('기준표 양식', `<p><b>${esc(fname)}</b> 파일을 공문 폴더에 만들었습니다.</p><p>기준값을 채워 저장한 뒤 엑셀을 닫고 <b>새로고침</b>을 누르세요.</p>`);
  } catch (e) { toast('양식을 만들지 못했습니다: ' + explain(e), 'err'); }
}

/* ───── 열 선택 ───── */
function renderColMenu() {
  const m = $('#colMenu');
  m.innerHTML = `<div class="cols">${COLS.map(c => `<label><input type="checkbox" value="${esc(c.k)}" ${state.cols.includes(c.k) ? 'checked' : ''}> ${esc(c.label || c.k)}</label>`).join('')}</div>
    <div class="pop-actions"><button class="btn small" data-act="cols-default">기본값</button><button class="btn small" data-act="cols-all">전체 표시</button></div>`;
}

/* ───── 도움말 ───── */
function showHelp() {
  info('사용 방법', `
    <h4>1. 공문 모으기</h4><p>검사의뢰 공문(ODT)을 공문 폴더에 저장합니다. 이 창으로 돌아오면 자동으로 다시 읽습니다.</p>
    <h4>2. 확인하기</h4><p>시료 1개당 1행으로 보입니다. 노란 칸·확인필요 열은 직접 확인이 필요한 값입니다. 행을 누르면 오른쪽에 공문 원문(시료 표·본문)이 나와 대조할 수 있습니다.</p>
    <h4>3. 완료 체크 → 처리 완료</h4><p>성적 작성이 끝난 공문의 맨 앞 칸을 체크합니다(공문 단위). 체크는 공문 폴더의 <b>${STATUS_FILE}</b>에 저장되어 프로그램을 껐다 켜도 유지됩니다. <b>[처리 완료]</b>를 누르면 체크한 공문이 <b>${DONE_DIR}</b> 폴더로 옮겨집니다.</p>
    <h4>4. 되돌리기</h4><p>필터에서 <b>성적처리완료 폴더</b>를 고르면 옮긴 공문이 보이고, [되돌리기]로 다시 공문 폴더로 옮길 수 있습니다.</p>
    <h4>5. 엑셀 저장</h4><p>현재 화면에 보이는 공문(필터 적용)을 시료 1행 형식으로 저장합니다. 모든 칸은 텍스트로 저장되어 시료번호가 날짜로 바뀌지 않습니다.</p>
    <h4>6. 기준표</h4><p><b>[기준표 양식 만들기]</b>로 기준이 빈 항목 목록을 만들고, 기준값을 채워 <b>기준표.xlsx</b>로 공문 폴더에 두면 빈 기준이 자동으로 채워집니다.</p>
    <h4>표시 설명</h4><p><span class="badge">본문</span> 채취일을 공문 본문 문장에서 찾음 · <span class="badge ok">기준표</span> 기준표에서 채운 값 포함 · 회색 행: 접수번호가 같은 중복 공문</p>`);
}

/* ───── 이벤트 ───── */
function bindUi() {
  $('#btnPick').onclick = pickFolder;
  $('#btnRefresh').onclick = () => scan();
  $('#btnHelp').onclick = showHelp;
  $('#btnDone').onclick = processChecked;
  $('#btnExcel').onclick = exportExcel;
  $('#btnStd').onclick = makeStdTemplate;
  let qt;
  $('#fSearch').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { state.filter.q = e.target.value; render(); }, 150); };
  $('#fOrg').onchange = e => { state.filter.org = e.target.value; render(); };
  $('#fState').onchange = async e => { state.filter.state = e.target.value; state.selected = null; if (e.target.value === 'done') await scan(); else render(); };
  $('#fWarn').onchange = e => { state.filter.warn = e.target.checked; render(); };
  $('#btnCols').onclick = e => { e.stopPropagation(); const m = $('#colMenu'); if (m.hidden) { renderColMenu(); m.hidden = false; } else m.hidden = true; };
  $('#colMenu').addEventListener('click', e => e.stopPropagation());
  $('#colMenu').addEventListener('change', e => {
    if (e.target.type !== 'checkbox') return;
    const k = e.target.value;
    state.cols = e.target.checked ? COLS.map(c => c.k).filter(x => x === k || state.cols.includes(x)) : state.cols.filter(x => x !== k);
    saveCols(); render();
  });
  $('#colMenu').addEventListener('click', e => {
    const a = e.target.dataset.act;
    if (a === 'cols-default') state.cols = COLS.filter(c => c.def).map(c => c.k);
    else if (a === 'cols-all') state.cols = COLS.map(c => c.k);
    else return;
    saveCols(); renderColMenu(); render();
  });
  document.addEventListener('click', () => { $('#colMenu').hidden = true; });

  const grid = $('#grid');
  grid.tHead.addEventListener('click', e => {
    const th = e.target.closest('th[data-k]'); if (!th) return;
    const k = th.dataset.k;
    state.sort = state.sort.key === k ? { key: k, dir: -state.sort.dir } : { key: k, dir: 1 };
    render();
  });
  grid.tHead.addEventListener('change', e => {
    if (e.target.id !== 'chkAll') return;
    const on = e.target.checked;
    for (const d of visibleDocs()) if (d.loc === 'root') setChecked(d, on);
    render();
  });
  grid.tBodies[0].addEventListener('click', e => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    const d = findDoc(tr.dataset.id); if (!d) return;
    const act = e.target.dataset.act;
    if (act === 'check') { setChecked(d, e.target.checked); render(); return; }
    if (act === 'restore') { restore(d); return; }
    if (e.target.closest('td.c-chk')) return;
    state.selected = state.selected === d.id ? null : d.id;
    render();
  });
  $('#detail').addEventListener('click', e => {
    const act = e.target.dataset.act; if (!act) return;
    const d = findDoc($('#detail').dataset.id);
    if (act === 'close') { state.selected = null; render(); }
    else if (act === 'check-toggle' && d) { setChecked(d, !isChecked(d)); render(); }
    else if (act === 'restore' && d) restore(d);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').hidden && state.selected) { state.selected = null; render(); } });
  // 창으로 돌아오면 폴더를 다시 읽음 (새로 저장한 공문 자동 반영)
  window.addEventListener('focus', () => { if (state.root && !state.busy && $('#modal').hidden && Date.now() - state.lastScan > 2000) scan({ quiet: true }); });
  window.addEventListener('beforeunload', () => { if (saveTimer) writeStatus(); });
}

init();
})();

</script>
