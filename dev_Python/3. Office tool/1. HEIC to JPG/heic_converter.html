<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이미지 변환기</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280; --line:#e2e5ea; --accent:#2563eb; --ok:#16a34a; --err:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1e2127; --text:#e8eaed; --muted:#9aa0a6; --line:#2e333b; --accent:#5b8def; --ok:#4ade80; --err:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  #drop { border:2px dashed var(--line); text-align:center; padding:36px 16px; cursor:pointer; transition:.15s; }
  #drop.over { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent); }
  #drop strong { display:block; font-size:17px; margin-bottom:4px; }
  #drop span { color:var(--muted); }
  .btns { margin-top:14px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:7px 14px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  .opts { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  select, input[type=number] { width:100%; font:inherit; padding:7px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .hint { font-size:12px; color:var(--muted); margin-top:2px; }
  .row { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .size { color:var(--muted); font-size:13px; white-space:nowrap; }
  .st { font-size:13px; min-width:70px; text-align:right; }
  .st.ok { color:var(--ok); } .st.err { color:var(--err); }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  progress { width:100%; height:6px; margin-top:10px; }
  a.dl { color:var(--accent); text-decoration:none; font-size:13px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>이미지 변환기</h1>
  <p class="sub">HEIC · JPG · PNG · WEBP 등을 원하는 형식과 화질로 변환합니다. 파일은 브라우저 안에서만 처리되며 서버로 전송되지 않습니다.</p>

  <div class="card" id="warn" hidden style="border-color:var(--err);color:var(--err)"></div>

  <div class="card" id="drop">
    <strong>파일 또는 폴더를 여기로 드래그하세요</strong>
    <span>HEIC/HEIF, JPG, PNG, WEBP, GIF, BMP 지원</span>
    <div class="btns">
      <button type="button" id="pickFiles">파일 선택</button>
      <button type="button" id="pickDir">폴더 선택</button>
    </div>
    <input id="fileInput" type="file" multiple accept="image/*,.heic,.heif" hidden>
    <input id="dirInput" type="file" webkitdirectory hidden>
  </div>

  <div class="card opts">
    <div>
      <label for="fmt">출력 형식</label>
      <select id="fmt">
        <option value="image/jpeg">JPG</option>
        <option value="image/png">PNG (무손실)</option>
        <option value="image/webp">WEBP</option>
      </select>
    </div>
    <div>
      <label for="q">화질: <b id="qv">85</b></label>
      <input id="q" type="range" min="10" max="100" value="85">
      <div class="hint" id="qhint">낮을수록 용량이 작아집니다.</div>
    </div>
    <div>
      <label for="maxmb">파일당 최대 용량 (MB, 0 = 제한 없음)</label>
      <input id="maxmb" type="number" min="0" step="0.1" value="0">
      <div class="hint">초과 시 화질 → 해상도 순으로 줄입니다.</div>
    </div>
  </div>

  <div class="card" id="listCard" hidden>
    <div class="head">
      <b id="count"></b>
      <div class="actions">
        <button type="button" id="clear">비우기</button>
        <button type="button" id="convert" class="primary">변환 시작</button>
        <button type="button" id="zip" disabled>ZIP으로 받기</button>
      </div>
    </div>
    <progress id="bar" value="0" max="1" hidden></progress>
    <div id="list"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/heic-to@1.6.5/dist/iife/heic-to.js"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const EXT = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" };
const IMG_RE = /\.(heic|heif|jpe?g|png|webp|gif|bmp|avif)$/i;
const HEIC_RE = /\.(heic|heif)$/i;
let items = []; // {file, path, row, result:{blob,name}}
let busy = false;

const fmtSize = n => n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.round(n / 1024) + " KB";

// ---------- 입력 수집 ----------
function addFiles(list) {
  for (const { file, path } of list) {
    if (!IMG_RE.test(file.name)) continue;
    if (items.some(i => i.path === path && i.file.size === file.size)) continue;
    items.push({ file, path, result: null, state: "" });
  }
  render();
}

function readEntries(reader) {
  return new Promise((res, rej) => {
    const all = [];
    (function next() {
      reader.readEntries(batch => batch.length ? (all.push(...batch), next()) : res(all), rej);
    })();
  });
}

async function walk(entry, out) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    out.push({ file, path: entry.fullPath.replace(/^\//, "") });
  } else if (entry.isDirectory) {
    for (const child of await readEntries(entry.createReader())) await walk(child, out);
  }
}

const drop = $("drop");
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", async ev => {
  const entries = [...ev.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const out = [];
  if (entries.length) for (const e of entries) await walk(e, out);
  else for (const f of ev.dataTransfer.files) out.push({ file: f, path: f.name });
  addFiles(out);
});
drop.addEventListener("click", ev => { if (ev.target === drop || ev.target.tagName === "STRONG" || ev.target.tagName === "SPAN") $("fileInput").click(); });
$("pickFiles").onclick = () => $("fileInput").click();
$("pickDir").onclick = () => $("dirInput").click();
$("fileInput").onchange = e => { addFiles([...e.target.files].map(f => ({ file: f, path: f.name }))); e.target.value = ""; };
$("dirInput").onchange = e => { addFiles([...e.target.files].map(f => ({ file: f, path: f.webkitRelativePath || f.name }))); e.target.value = ""; };

// ---------- 옵션 ----------
function syncOpts() {
  const png = $("fmt").value === "image/png";
  $("q").disabled = png;
  $("qv").textContent = png ? "—" : $("q").value;
  $("qhint").textContent = png ? "PNG는 무손실이라 화질 설정이 없습니다. 용량 제한 시 해상도만 줄입니다." : "낮을수록 용량이 작아집니다.";
}
$("fmt").onchange = syncOpts;
$("q").oninput = syncOpts;
syncOpts();

// ---------- 목록 ----------
function render() {
  $("listCard").hidden = items.length === 0;
  $("count").textContent = `${items.length}개 파일`;
  $("list").innerHTML = "";
  for (const it of items) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="name"></span><span class="size"></span><span class="st"></span>`;
    row.children[0].textContent = it.path;
    row.children[0].title = it.path;
    row.children[1].textContent = fmtSize(it.file.size);
    it.row = row;
    $("list").appendChild(row);
    paint(it);
  }
  $("zip").disabled = !items.some(i => i.result);
}

function paint(it, text) {
  const st = it.row.children[2];
  st.className = "st " + (it.state === "ok" ? "ok" : it.state === "err" ? "err" : "");
  st.innerHTML = "";
  if (it.state === "ok") {
    const a = document.createElement("a");
    a.className = "dl"; a.href = URL.createObjectURL(it.result.blob); a.download = it.result.name;
    a.textContent = `↓ ${fmtSize(it.result.blob.size)}`;
    st.appendChild(a);
  } else st.textContent = text || it.state;
}

$("clear").onclick = () => { if (!busy) { items = []; render(); } };

// ---------- 변환 ----------
const errText = e => (e && (e.message || (typeof e === "string" ? e : JSON.stringify(e)))) || String(e);

// 라이브러리 로드 점검
(function checkLibs() {
  const miss = [];
  if (typeof HeicTo === "undefined" && typeof heic2any === "undefined") miss.push("HEIC 디코더");
  if (typeof JSZip === "undefined") miss.push("ZIP");
  if (miss.length) {
    const w = $("warn");
    w.hidden = false;
    w.textContent = `${miss.join(", ")} 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.` +
      (typeof HeicTo === "undefined" && typeof heic2any === "undefined" ? " (HEIC 변환 불가)" : "");
  }
})();

// HEIC 여부: 확장자 또는 파일 헤더(ftyp 브랜드)로 판단
async function isHeicFile(file) {
  if (HEIC_RE.test(file.name) || /hei[cf]/i.test(file.type)) return true;
  try {
    const head = new TextDecoder().decode(await file.slice(4, 12).arrayBuffer());
    return /^ftyp(heic|heix|hevc|hevx|mif1|msf1)/.test(head);
  } catch { return false; }
}

function loadViaImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => createImageBitmap(img).then(res, rej).finally(() => URL.revokeObjectURL(url));
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("이미지를 열 수 없습니다")); };
    img.src = url;
  });
}

// 디코딩 순서: (HEIC) heic-to → heic2any → 브라우저 기본,  (그 외) 브라우저 기본
async function decode(file) {
  const errs = [];
  if (await isHeicFile(file)) {
    if (typeof HeicTo !== "undefined") {
      try { return await HeicTo({ blob: file, type: "bitmap" }); } catch (e) { errs.push("heic-to: " + errText(e)); }
    }
    if (typeof heic2any !== "undefined") {
      try {
        const out = await heic2any({ blob: file, toType: "image/png" });
        return await createImageBitmap(Array.isArray(out) ? out[0] : out);
      } catch (e) { errs.push("heic2any: " + errText(e)); }
    }
    try { return await createImageBitmap(file); } catch (e) { errs.push("native: " + errText(e)); }
    throw new Error(errs.join(" / "));
  }
  try { return await createImageBitmap(file); } catch (e) { errs.push(errText(e)); }
  try { return await loadViaImg(file); } catch (e) { errs.push(errText(e)); }
  throw new Error(errs.join(" / "));
}

function toBlob(canvas, mime, q) {
  return new Promise(res => canvas.toBlob(res, mime, q));
}

async function convertOne(file, mime, quality, maxBytes) {
  const bmp = await decode(file);
  let w = bmp.width, h = bmp.height;
  const qualities = mime === "image/png" ? [1] : [];
  if (!qualities.length) for (let q = quality; q >= 40; q -= 10) qualities.push(q / 100);
  if (!qualities.length) qualities.push(quality / 100);
  while (true) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    if (mime === "image/jpeg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); }
    ctx.drawImage(bmp, 0, 0, w, h);
    for (const q of qualities) {
      const blob = await toBlob(c, mime, q);
      if (!blob) throw new Error("이 브라우저는 해당 형식을 지원하지 않습니다");
      if (!maxBytes || blob.size <= maxBytes || (w < 64 && h < 64)) { bmp.close(); return blob; }
    }
    w = Math.floor(w * 0.85); h = Math.floor(h * 0.85);
  }
}

$("convert").onclick = async () => {
  if (busy || !items.length) return;
  busy = true;
  ["convert", "clear", "zip"].forEach(id => $(id).disabled = true);
  const mime = $("fmt").value, quality = +$("q").value, maxBytes = Math.round((+$("maxmb").value || 0) * 1e6);
  const bar = $("bar"); bar.hidden = false; bar.max = items.length; bar.value = 0;
  for (const it of items) {
    it.state = ""; it.result = null; paint(it, "변환 중…");
    it.row.querySelectorAll(".hint").forEach(n => n.remove());
    try {
      const blob = await convertOne(it.file, mime, quality, maxBytes);
      it.result = { blob, name: it.path.replace(/\.[^./]+$/, "") + "." + EXT[mime] };
      it.state = "ok"; paint(it);
    } catch (e) {
      it.state = "err"; paint(it, "실패");
      it.row.children[2].title = errText(e);
      const msg = document.createElement("div");
      msg.className = "hint"; msg.style.cssText = "flex-basis:100%;color:var(--err);word-break:break-all";
      msg.textContent = errText(e);
      it.row.style.flexWrap = "wrap"; it.row.appendChild(msg);
      console.error(it.path, e);
    }
    bar.value++;
    await new Promise(r => setTimeout(r)); // UI 갱신
  }
  busy = false;
  $("convert").disabled = false; $("clear").disabled = false;
  $("zip").disabled = !items.some(i => i.result);
};

$("zip").onclick = async () => {
  const zip = new JSZip(), used = new Set();
  for (const it of items) {
    if (!it.result) continue;
    let name = it.result.name, n = 1;
    while (used.has(name)) name = it.result.name.replace(/(\.[^.]+)$/, ` (${n++})$1`);
    used.add(name);
    zip.file(name, it.result.blob);
  }
  const blob = await zip.generateAsync({ type: "blob" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "converted.zip"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
</script>
</body>
</html>
